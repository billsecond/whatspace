[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/billsecond/whatspace"

[workspace.dependencies]
# internal
whatspace-fs = { path = "crates/fs" }
whatspace-model = { path = "crates/model" }
whatspace-scan = { path = "crates/scan" }
whatspace-ui-egui = { path = "crates/ui-egui" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
proptest = "1"
# Dates in the owner's own time zone: the IANA Time Zone Database compiled in
# (`tzdb-bundle-always`: the same rules on every platform) and the system's zone. Unlicense OR MIT.
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-bundle-always"] }

# What the operating system says about its disks: mount points, file system names, total and free
# space (Windows, macOS, Linux and FreeBSD). Only the disk part is compiled. MIT.
sysinfo = { version = "0.40", default-features = false, features = ["disk"] }
# The allocation unit (cluster or block size) of a volume, through GetDiskFreeSpaceW on Windows and
# statvfs elsewhere. MIT OR Apache-2.0.
fs4 = { version = "1.1", default-features = false, features = ["sync"] }
# Windows only: GetCompressedFileSizeW, the space a compressed, sparse or deduplicated file really
# takes. MIT.
filesize = "0.2"
# Windows only: a file's volume serial number, file index and link count, to count a hard-linked
# file once (safe wrappers over the Windows API). MIT OR Unlicense.
winapi-util = "0.1.11"

# images (the app icon, written by `cargo xtask icon`)
image = { version = "0.25", default-features = false, features = ["png"] }

# ui
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
# Moves what the owner chose to the Recycle Bin or the desktop's Trash, from where it can be put
# back. MIT.
trash = "5.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
